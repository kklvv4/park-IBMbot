services:
  - type: web
    name: malaysia-parking-map
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python convert.py"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
    plan: free
